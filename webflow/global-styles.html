<style>
/* ============================================
   RC STRUCTURE — WEBFLOW GLOBAL CSS  v1.15
   Sadece Designer'ın veremediği şeyler.
   Kaynak: github.com/Roicool/rc-structure/webflow/global-styles.html
   ============================================ */


/* ── GRADIENT TOKENLARI ────────────────────────────────────────
   bg-gradient-*, text-gradient-*, border-gradient-* class'ları
   bu değişkenleri kullanır. Değerler renk token'larından türer;
   sitede marka renkleri değişince gradient'ler de otomatik değişir.
─────────────────────────────────────────────────────────────── */
:root {
  /* Marka */
  --gradient--brand:        linear-gradient(135deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--brand-hover:  linear-gradient(135deg, var(--brand-primary--600), var(--brand-secondary--600));
  --gradient--brand-soft:   linear-gradient(135deg, var(--brand-primary--100), var(--brand-secondary--100));
  --gradient--brand-deep:   linear-gradient(135deg, var(--brand-primary--800), var(--brand-secondary--900));

  /* Buton */
  --gradient--btn-primary:       linear-gradient(90deg, var(--brand-primary--600), var(--brand-primary--400));
  --gradient--btn-primary-hover: linear-gradient(90deg, var(--brand-primary--700), var(--brand-primary--500));

  /* Koyu yüzeyler */
  --gradient--btn-soft:          linear-gradient(180deg, rgba(49, 81, 94, 0.1) 0%, rgba(49, 81, 94, 0.1) 0.01%, rgba(141, 180, 187, 0.1) 139.6%);
  --gradient--btn-soft-hover:    linear-gradient(180deg, rgba(49, 81, 94, 0.16) 0%, rgba(141, 180, 187, 0.16) 139.6%);
  --gradient--ink:          linear-gradient(180deg, var(--neutral--900), var(--neutral--950));
  --gradient--ink-flat:     linear-gradient(180deg, var(--neutral--950), var(--neutral--900));

  /* Metin */
  --gradient--text-brand:   linear-gradient(90deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--text-ink:     linear-gradient(90deg, var(--neutral--950), var(--neutral--600));
  --gradient--text-mist:    linear-gradient(90deg, var(--neutral--0), var(--neutral--400));

  /* Kenarlık */
  --gradient--border-brand: linear-gradient(135deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--border-shine: linear-gradient(135deg, var(--neutral--0), var(--neutral--300), var(--neutral--0));

  /* Hero arka planları */
  --gradient--hero-dawn:    radial-gradient(120% 80% at 50% 0%, var(--brand-primary--100), var(--neutral--0) 70%);
  --gradient--hero-dusk:    radial-gradient(120% 80% at 50% 0%, var(--brand-secondary--800), var(--neutral--950) 70%);
  --gradient--hero-halo:    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--brand-primary--300) 60%, transparent), transparent 70%);

  /* Parıltı */
  --gradient--glow-warm:    radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--brand-primary--300) 50%, transparent), transparent 70%);
  --gradient--glow-cool:    radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--brand-secondary--300) 50%, transparent), transparent 70%);

  /* Yumuşak zeminler */
  --gradient--wash-warm:    linear-gradient(180deg, var(--brand-primary--100), var(--neutral--0));
  --gradient--wash-cool:    linear-gradient(180deg, var(--brand-secondary--100), var(--neutral--0));
  --gradient--wash-horizon: linear-gradient(180deg, var(--neutral--0), var(--neutral--100));
  --gradient--wash-rise:    linear-gradient(0deg, var(--brand-primary--100), transparent);

  /* Görsel üstü karartma (okunabilirlik) */
  --gradient--scrim-top:    linear-gradient(180deg, color-mix(in srgb, var(--neutral--950) 70%, transparent), transparent);
  --gradient--scrim-bottom: linear-gradient(0deg, color-mix(in srgb, var(--neutral--950) 70%, transparent), transparent);
  --gradient--scrim-full:   linear-gradient(0deg, color-mix(in srgb, var(--neutral--950) 60%, transparent), color-mix(in srgb, var(--neutral--950) 60%, transparent));
}


/* ── MARGIN RESET ──────────────────────────────────────────────
   Webflow'un varsayılan h1–h6 / p / figure / blockquote margin'leri
   utility sistemini bozar (ölçülen bug: h1 alt 10px + p alt 10px).
   Boşluk her zaman gap-* / m*-* utility'leri ile verilir.
─────────────────────────────────────────────────────────────── */
h1, h2, h3, h4, h5, h6, p, figure, blockquote, ul, ol { margin-top: 0; margin-bottom: 0; }

/* ── FIXED NAVBAR ────────────────────────────────────────────────
   Varsayılan koyu (JS yüklenmezse okunur). nav-scroll modülü en üstte
   data-rc-nav="top" ekler → şeffaf.
─────────────────────────────────────────────────────────────── */
html { scroll-padding-top: 90px; }
.nav { background-color: color-mix(in srgb, var(--neutral--900) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--neutral--0) 6%, transparent); }
.nav[data-rc-nav="top"] { background-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: transparent; }
/* Stat kartları (İnavitas Elektrik): yarı saydam zemin. Style API color-mix kaydetmiyor, kural burada */
.stat-card { background-color: color-mix(in srgb, var(--neutral--925) 60%, transparent); }
.stat-card.is-soft { background-color: color-mix(in srgb, var(--neutral--925) 40%, transparent); }
/* Why slider (İnavitas Elektrik): kaydırma çubuğu gizli, uçta pasif ok (carousel modülü disabled verir) */
.why-track { scrollbar-width: none; }
.why-track::-webkit-scrollbar { display: none; }
.why-nav-btn[disabled], .why-nav-btn[aria-disabled="true"] { color: var(--neutral--550); cursor: default; }
/* Why cards — hover reveal (Builder A, r4). Kapalıyken açıklama satırı 0 yükseklik: overflow + min-height */
.why-card>img{border-radius:inherit}
.why-card-shade,.why-card-reveal,.why-card-desc{transition:opacity .3s ease-out,grid-template-rows .3s ease-out,transform .3s ease-out}
.why-card-reveal{grid-template-rows:0fr;opacity:0;overflow:hidden}
.why-card-reveal>*{min-height:0}
.why-card-desc{transform:translateY(8px)}
.why-card-desc::before{content:"";display:block;height:1rem}
.why-card:hover .why-card-shade,.why-card:focus-within .why-card-shade{opacity:.8}
.why-card:hover .why-card-reveal,.why-card:focus-within .why-card-reveal{grid-template-rows:1fr;opacity:1}
.why-card:hover .why-card-desc,.why-card:focus-within .why-card-desc{transform:none}
@media (hover:none){.why-card-shade{opacity:.8}.why-card-reveal{grid-template-rows:1fr;opacity:1}.why-card-desc{transform:none}}
/* Why nav — arrow hover */
.why-nav-btn{transition:background-color .2s ease-out}
.why-nav-btn:not([disabled]):hover,.why-nav-btn:not([disabled]):focus-visible{background-color:var(--interactive--nav-hover)}
@media (prefers-reduced-motion:reduce){.why-card-shade,.why-card-reveal,.why-card-desc,.why-nav-btn{transition:none}}
/* Nav aktif durum (Figma): metin altında 1px mint çizgi.
   Liste sayfaları: Webflow w--current (nav-link veya açılır menüdeki dropdown-item).
   CMS template / alt sayfalar: main'de data-nav-active="services" | "resources". */
.nav .nav-link.w--current,
.nav .nav-dropdown:has(.dropdown-item.w--current) > .nav-link,
body:has([data-nav-active="services"]) .nav .nav-dropdown:has(.is-services):not(:has(a[href="/blogs"])) > .nav-link,
body:has([data-nav-active="resources"]) .nav .nav-dropdown:has(a[href="/blogs"]) > .nav-link { position: relative; }
.nav .nav-link.w--current::after,
.nav .nav-dropdown:has(.dropdown-item.w--current) > .nav-link::after,
body:has([data-nav-active="services"]) .nav .nav-dropdown:has(.is-services):not(:has(a[href="/blogs"])) > .nav-link::after,
body:has([data-nav-active="resources"]) .nav .nav-dropdown:has(a[href="/blogs"]) > .nav-link::after { content: ""; position: absolute; left: 15px; right: 11px; top: 35px; height: 1px; background-color: var(--accent--mint); }
/* Footer link hover (Figma): mint alt çizgi, metin rengi aynı. Sadece link (adres <p> değil) */
a.ft-link{text-decoration-line:underline;text-decoration-color:transparent;text-decoration-thickness:1px;text-underline-offset:4px;transition:text-decoration-color .2s ease-out}
a.ft-link:hover,a.ft-link:focus-visible{text-decoration-color:var(--accent--mint)}

/* ── NAV DROPDOWN (JS'siz) ──────────────────────────────────────
   .nav-dropdown > .nav-link + .nav-dropdown-panel
   Hover ve klavye odağında (focus-within) açılır. Designer'ın veremediği
   ebeveyn-hover → çocuk seçicileri burada.
─────────────────────────────────────────────────────────────── */
.nav-dropdown:hover > .nav-dropdown-panel,
.nav-dropdown:focus-within > .nav-dropdown-panel { visibility: visible; opacity: 1; }
.nav-dropdown:hover > .nav-link,
.nav-dropdown:focus-within > .nav-link { background-color: var(--neutral--0); color: var(--brand-secondary--600); }
.nav-dropdown > .nav-link svg { transition: transform 200ms ease; }
/* Mobil menü (native popover, JS'siz) */
.nav:has(.mobile-menu:popover-open) .nav-burger-open { display: none; }
.nav:has(.mobile-menu:popover-open) .nav-burger-close { display: flex; }
.nav-burger { border: 0; padding: 0; }
.mobile-acc { border-bottom: 1px solid var(--neutral--200); }
.mobile-acc > summary { list-style: none; border-bottom: 0; }
.mobile-acc > summary::-webkit-details-marker { display: none; }
.mobile-acc > summary svg { transition: transform 200ms ease; flex-shrink: 0; }
.mobile-acc[open] > summary svg { transform: rotate(180deg); }
.mobile-acc[open] > summary { color: var(--brand-secondary--600); }
@media screen and (max-width: 991px) { .nav-inner { padding-left: calc(var(--view--px) - var(--spacing--4)); padding-right: var(--view--px); } }
/* 2 satır kırpma — Webflow -webkit-line-clamp'i Designer'da düşürüyor */
.news-card-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.nav-dropdown:hover > .nav-link svg,
.nav-dropdown:focus-within > .nav-link svg { transform: rotate(180deg); }


/* ── FONT & TEXT RENDERING ───────────────────────────────────── */
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

/* ── MOBILE TAP HIGHLIGHT ────────────────────────────────────── */
* { -webkit-tap-highlight-color: transparent; }

/* ── SMOOTH SCROLL + SCROLLBAR GUTTER ────────────────────────── */
html {
  scroll-behavior: smooth;
  scrollbar-gutter: stable;
}

/* ── IMAGES ──────────────────────────────────────────────────── */
img, video {
  display: block;
  max-width: 100%;
}

/* ── TYPOGRAPHY OVERFLOW (uzun Türkçe kelimeler / URL'ler) ───── */
p, li, blockquote, figcaption, h1, h2, h3, h4, h5, h6 {
  overflow-wrap: break-word;
}

/* ── FOCUS ───────────────────────────────────────────────────────
   Mouse ile tıklamada outline yok, klavyede görünür.
   :focus-visible desteklemeyen tarayıcıda varsayılan outline kalır.
─────────────────────────────────────────────────────────────── */
:focus:not(:focus-visible) { outline: none; }
:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
  border-radius: 2px;
}

/* ── SELECTION (marka rengine bağlı) ─────────────────────────── */
::selection {
  background-color: var(--brand-primary--200);
  color: inherit;
}

/* ── PLACEHOLDER ─────────────────────────────────────────────── */
::placeholder {
  opacity: 0.5;
  color: inherit;
}

/* ── CURSOR ──────────────────────────────────────────────────── */
button, [role="button"], label[for], select, summary {
  cursor: pointer;
}

/* ── SVG RENK KALITIMI ───────────────────────────────────────────
   Sadece fill attribute'u olmayan SVG'ler parent rengini alır.
   Stroke (outline) ikonlar fill="none" taşır, bozulmaz.
─────────────────────────────────────────────────────────────── */
svg:not([fill]) { fill: currentColor; }

/* ── REDUCED MOTION ──────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
